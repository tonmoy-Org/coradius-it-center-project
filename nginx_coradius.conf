##############################################################################
#  Coradius IT Center – Production Nginx Config (PageSpeed 90+)
#  Optimised: gzip, static caching, security headers, PHP-FPM tuning
##############################################################################

# Rate-limiting zone (protect against DDoS / brute-force)
limit_req_zone $binary_remote_addr zone=one:10m rate=30r/s;

server {
    listen 80;
    listen [::]:80;
    server_name coradiusitcenter.com www.coradiusitcenter.com;
    root /var/www/coradiusitcenter/public;

    index index.php;
    charset utf-8;

    client_max_body_size 500M;
    client_body_timeout  60s;
    keepalive_timeout    75s;

    # ── Security headers ──────────────────────────────────────────────────
    add_header X-Frame-Options          "SAMEORIGIN"            always;
    add_header X-Content-Type-Options   "nosniff"               always;
    add_header X-XSS-Protection         "1; mode=block"         always;
    add_header Referrer-Policy          "strict-origin-when-cross-origin" always;

    # ── Gzip compression ─────────────────────────────────────────────────
    gzip              on;
    gzip_vary         on;
    gzip_proxied      any;
    gzip_comp_level   6;
    gzip_buffers      16 8k;
    gzip_http_version 1.1;
    gzip_min_length   256;
    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/javascript
        application/x-javascript
        application/json
        application/xml
        application/xml+rss
        application/atom+xml
        application/rss+xml
        application/font-woff
        application/font-woff2
        font/truetype
        font/opentype
        font/woff
        font/woff2
        image/svg+xml
        image/x-icon;

    # ── Static asset caching (1 year) ────────────────────────────────────
    location ~* \.(css|js|woff|woff2|ttf|eot|otf)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        add_header X-Content-Type-Options "nosniff" always;
        access_log off;
        log_not_found off;
        gzip_static on;
    }

    location ~* \.(jpg|jpeg|png|gif|webp|avif|ico|svg|mp4|webm|ogg|mp3|wav|pdf|zip)$ {
        expires 6M;
        add_header Cache-Control "public, no-transform";
        access_log off;
        log_not_found off;
    }

    # ── HTML / Blade responses – no cache ────────────────────────────────
    location ~* \.(html|htm)$ {
        expires -1;
        add_header Cache-Control "no-store, no-cache, must-revalidate";
    }

    # ── Main routing ─────────────────────────────────────────────────────
    location / {
        limit_req zone=one burst=60 nodelay;
        try_files $uri $uri/ /index.php?$query_string;
    }

    location = /favicon.ico { access_log off; log_not_found off; }
    location = /robots.txt  { access_log off; log_not_found off; }

    error_page 404 /index.php;

    # ── PHP-FPM ──────────────────────────────────────────────────────────
    location ~ \.php$ {
        fastcgi_pass              unix:/var/run/php/php8.3-fpm.sock;
        fastcgi_param             SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        include                   fastcgi_params;

        fastcgi_connect_timeout   60s;
        fastcgi_send_timeout      180s;
        fastcgi_read_timeout      180s;
        fastcgi_buffer_size       128k;
        fastcgi_buffers           4 256k;
        fastcgi_busy_buffers_size 256k;

        # PHP-level caching headers for dynamic pages
        add_header Cache-Control "no-store, private" always;
    }

    # ── Block hidden files ────────────────────────────────────────────────
    location ~ /\.(?!well-known).* {
        deny all;
    }
}
